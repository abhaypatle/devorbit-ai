[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devorbit-ai"
version = "2.0.0"
description = "Tenant-isolated client, project, and subscription operating system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "langgraph>=0.2,<1",
  "boto3>=1.35,<2",
  "openai>=1.54,<3",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "python-multipart>=0.0.17,<1",
  "reportlab>=4.2,<5",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
