name: DevOrbit CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, compile, tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://devorbit:devorbit@localhost:5432/devorbit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check --select E4,E7,E9,F app tests alembic
      - name: Compile
        run: python -m compileall -q app alembic tests
      - name: Pytest
        run: python -m pytest tests -q
      - name: Validate Alembic SQL generation
        run: alembic upgrade head --sql > /tmp/devorbit-migrations.sql

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck and build
        run: npm run build

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
